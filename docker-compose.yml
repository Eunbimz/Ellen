# Run from the "Project Ellen" root: docker compose up -d --build
#
# Ollama stays on Windows (not containerized), backend reaches it via
# host.docker.internal. Everything else runs in this compose network.

services:

  # Postgres + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ellen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ellen
      POSTGRES_PASSWORD: ellen
      POSTGRES_DB: ellen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ellen -d ellen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local speech-to-text (whisper.cpp)
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: ellen-whisper
    restart: unless-stopped
    ports:
      - "9000:8080"
    volumes:
      - whisper-models:/models
    command:
      - >
        ./models/download-ggml-model.sh base /models &&
        whisper-server -m /models/ggml-base.bin --host 0.0.0.0 --port 8080 --convert --language auto

  # Backend (Express API)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ellen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_started
    environment:
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ellen
      DB_PASSWORD: ellen
      DB_NAME: ellen

      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3.5:0.8b
      OLLAMA_EMBED_MODEL: nomic-embed-text

      WHISPER_URL: http://whisper:8080
    ports:
      - "5000:5000"
    volumes:
      - ./Backend/src:/app/src
      - backend-node-modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ellen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next

volumes:
  postgres-data:
  whisper-models:
  backend-node-modules:
  frontend-node-modules:
  frontend-next: